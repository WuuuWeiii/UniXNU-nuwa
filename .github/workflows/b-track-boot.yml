# B track: pack the xnu-8796 (ios-sweet) kernel into a nuwa boot image.
#
# A track built its own xnu-10063 kernel + prelink on a macOS runner; the B track uses the
# ios-sweet kernel, which is NOT prelinked: all __PRELINK_* segments are empty and the HFS+
# support is compiled in (patches/xnu-sweet/0026-sweet-builtin-hfs.patch), so the payload
# carries a plain Mach-O and DarwinBoot copies flat segments.
#
# Inputs are the latest successful xnu-8796 run (artifact xnu-8796-kernel) and the latest
# stage1 firmware volume (SILICIUM_UEFI.fd). Nothing here needs a Mac.
name: b-track-boot

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: 'UniXNU branch/tag/commit'
        type: string
        default: 'main'
      unique_chip_id:
        description: '8-byte platform seed for the ADT'
        type: string
        default: '0102030405060708'
      xnu_run_id:
        description: 'xnu-8796 run id that produced the kernel (blank = latest successful)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: b-track-boot-${{ github.ref }}
  cancel-in-progress: true

env:
  UNIXNU_OUT: ${{ github.workspace }}/UniXNU/out
  UNIXNU_UEFI: ${{ github.workspace }}/Mu-Silicium
  UNIXNU_DTB: ${{ github.workspace }}/Mu-Silicium/Platforms/Xiaomi/nuwaPkg/FdtBlob/sm8550-xiaomi-nuwa.dtb

jobs:
  boot:
    name: payload + boot image (B track)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive

      - name: Checkout UniXNU build driver
        uses: actions/checkout@v4
        with:
          repository: pubglite55/UniXNU
          ref: ${{ inputs.unixnu_ref || 'main' }}
          path: UniXNU
          submodules: recursive

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          repository: pubglite55/uefi-nuwa
          path: Mu-Silicium
          fetch-depth: 1
          submodules: false

      - name: Install payload/bootimg dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                       -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                       -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential clang lld llvm device-tree-compiler mtools python3 git

      - name: Find the xnu-8796 run that holds the kernel
        id: xnu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ inputs.xnu_run_id }}
        run: |
          if [ -n "$WANT" ]; then
            run_id="$WANT"
          else
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow xnu-8796.yml \
                       --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$run_id" || { echo '::error::no successful xnu-8796 run; build the kernel first'; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "using xnu-8796 run $run_id"

      - name: Download the B-track kernel
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.xnu.outputs.run_id }}
          name: xnu-8796-kernel
          path: kernel-artifact

      - name: Find the most recent successful stage1 run
        id: stage1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow stage1-firmware.yml \
                     --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" || { echo '::error::no successful stage1-firmware run yet'; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "using stage1 run $run_id"

      - name: Download the firmware volume
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.stage1.outputs.run_id }}
          pattern: nuwa-stage1-*
          path: stage1-artifacts

      - name: Build the payload and pack the boot image
        working-directory: UniXNU
        run: |
          fd=$(find "$GITHUB_WORKSPACE/stage1-artifacts" -name SILICIUM_UEFI.fd | head -n1)
          kernel=$(find "$GITHUB_WORKSPACE/kernel-artifact" -name 'kernel.development.sweet' | head -n1)
          test -n "$fd" || { echo '::error::SILICIUM_UEFI.fd not found in the stage1 artifact'; exit 1; }
          test -n "$kernel" || { echo '::error::kernel.development.sweet not found in the xnu-8796 artifact'; exit 1; }
          echo "firmware: $fd"
          echo "kernel  : $kernel ($(stat -c%s "$kernel") bytes)"
          trust="$GITHUB_WORKSPACE/device/trust/iphone10.3-16.7.16.bundle"
          test -f "$trust" || { echo "::error::trust cache bundle missing: $trust"; exit 1; }
          python3 ./unixnu defconfig nuwa_defconfig -D "$GITHUB_WORKSPACE/device"
          python3 ./unixnu build payload -D "$GITHUB_WORKSPACE/device" --kernel "$kernel" \
            --unique-chip-id "${{ inputs.unique_chip_id }}" --trust-cache "$trust"
          python3 ./unixnu bootimg -D "$GITHUB_WORKSPACE/device" \
            --uefi "$UNIXNU_UEFI" --fd "$fd" --dtb "$UNIXNU_DTB" \
            --ramdisk "$UNIXNU_OUT/nuwa/payload/payload.img" || true
          python3 "$GITHUB_WORKSPACE/device/scripts/check-bootimg.py" "$UNIXNU_OUT/nuwa/boot/boot.img"
          test -s "$UNIXNU_OUT/nuwa/payload/payload.img" || { echo '::error::payload.img missing'; exit 1; }
          echo '--- payload report ---'
          cat "$UNIXNU_OUT/nuwa/payload/payload.json"

      - name: Upload the B-track boot image
        uses: actions/upload-artifact@v4
        with:
          name: b-track-boot
          path: |
            UniXNU/out/nuwa/boot/**
            UniXNU/out/nuwa/payload/**
            UniXNU/out/nuwa/logs/**
          if-no-files-found: warn
          retention-days: 14
