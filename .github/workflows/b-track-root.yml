name: b-track-root

# Build the B-track iOS root on macOS, where APFS and HFS+ are native: hdiutil attaches the
# three IPSW volumes and a plain HFS+ image is formatted with newfs_hfs. Same result as
# ios-sweet's Linux mkiosroot.sh (one case-sensitive journaled HFS+ volume holding the OS root,
# both cryptexes and the dyld shared cache hard-linked where dyld looks), without apfs-fuse.
on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: iPhone10,3 16.7.16 IPSW URL
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
      root_size:
        description: HFS+ image size in MiB
        default: "16384"

jobs:
  root:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download the IPSW
        run: |
          curl -L --fail -o ipsw.zip "${{ inputs.ipsw_url }}"
          unzip -q ipsw.zip '*087-86698-044.dmg' '*087-86593-047.dmg' '*087-86715-047.dmg'
          rm -f ipsw.zip
          find . -name '*.dmg' | sort
          df -h /

      - name: Create and format the HFS+ image
        run: |
          size="${{ inputs.root_size }}"
          # newfs_hfs wants a device, not a plain file: build an empty image, format the device
          # behind it, then mount the image normally.
          hdiutil create -size "${size}m" -type UDIF -volname iOSRoot ios16-root.img
          attach="$(hdiutil attach -nomount ios16-root.img)"
          echo "$attach"
          dev="$(echo "$attach" | awk '{print $1}' | head -1)"
          newfs_hfs -v iOSRoot -s -J -b 4096 "/dev/r$(basename "$dev")"
          hdiutil detach "$dev"
          mkdir -p mnt
          hdiutil attach ios16-root.img -mountpoint mnt -nobrowse
          df -h mnt

      - name: Mount the IPSW volumes
        run: |
          os="$(find . -name '087-86698-044.dmg' -print -quit)"
          sysos="$(find . -name '087-86593-047.dmg' -print -quit)"
          appos="$(find . -name '087-86715-047.dmg' -print -quit)"
          mkdir -p mnt-os mnt-sysos mnt-appos
          hdiutil attach "$os" -mountpoint mnt-os -nobrowse -readonly
          hdiutil attach "$sysos" -mountpoint mnt-sysos -nobrowse -readonly
          hdiutil attach "$appos" -mountpoint mnt-appos -nobrowse -readonly
          echo "os:    $(ls mnt-os | head -3 | tr '\n' ' ')"
          echo "sysos: $(ls mnt-sysos | head -3 | tr '\n' ' ')"
          echo "appos: $(ls mnt-appos | head -3 | tr '\n' ' ')"
          df -h mnt-os mnt-sysos mnt-appos

      - name: Populate the root
        run: |
          # Case-sensitive HFS+ copy preserving owners, modes, symlinks and hard links.
          sudo rsync -aH --numeric-ids mnt-os/ mnt/
          sudo mkdir -p mnt/private/preboot/Cryptexes/OS mnt/private/preboot/Cryptexes/App
          sudo rsync -aH --numeric-ids mnt-sysos/ mnt/private/preboot/Cryptexes/OS/
          sudo rsync -aH --numeric-ids mnt-appos/ mnt/private/preboot/Cryptexes/App/

          # dyld's ignition-level-1 location: hard links to the cryptex cache, no extra space.
          dsc=mnt/private/preboot/Cryptexes/OS/System/Library/Caches/com.apple.dyld
          sudo mkdir -p mnt/System/Library/Caches/com.apple.dyld
          for f in "$dsc"/*; do
            sudo ln "$f" "mnt/System/Library/Caches/com.apple.dyld/${f##*/}"
          done

          # Cryptex files with no counterpart in the OS root (libobjc-trampolines etc).
          for cryptex in OS App; do
            base="mnt/private/preboot/Cryptexes/$cryptex"
            (cd "$base" && sudo find . -type f ! -path './System/Library/Caches/com.apple.dyld/*') |
            while IFS= read -r f; do
              f="${f#./}"
              if ! sudo test -e "mnt/$f"; then
                sudo mkdir -p "mnt/$(dirname "$f")"
                src="$base/$f"
                if sudo test -L "$src"; then sudo cp -P "$src" "mnt/$f"; else sudo ln "$src" "mnt/$f"; fi
              fi
            done
          done
          sudo du -sh mnt
          sudo df -h mnt

      - name: Log directories and system keybag
        run: |
          db=mnt/private/var/db
          sudo install -d -o 272 -g 272 -m 0751 "$db/diagnostics"
          sudo install -d -o 272 -g 272 -m 0755 "$db/uuidtext" "$db/diagnostics/timesync"
          for d in diagnostics uuidtext diagnostics/timesync; do
            sudo install -o 272 -g 272 -m 0644 /dev/null "$db/$d/.migrated"
          done
          sudo install -d -m 0700 -o 0 -g 0 mnt/private/var/keybags
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>KeyBagKeys</key><data>U1dFRVQ=</data></dict></plist>' |
            sudo tee mnt/private/var/keybags/systembag.kb >/dev/null
          sudo chmod 0600 mnt/private/var/keybags/systembag.kb

      - name: Apply the bring-up tweaks
        run: |
          sudo python3 tools/sweet-root-tweaks.py mnt

      - name: Detach and pack
        run: |
          sudo chown -R "$(id -u):$(id -g)" mnt 2>/dev/null || true
          hdiutil detach mnt-os || true
          hdiutil detach mnt-sysos || true
          hdiutil detach mnt-appos || true
          hdiutil detach mnt
          sync
          # Export the plain HFS+ payload (no UDIF trailer): read the backing device directly.
          attach="$(hdiutil attach -nomount ios16-root.img)"
          dev="$(echo "$attach" | awk '{print $1}' | head -1)"
          dd if="/dev/r$(basename "$dev")" of=ios16-root.raw bs=1m
          hdiutil detach "$dev"
          ls -l ios16-root.raw
          split -b 1800m -d -a 2 ios16-root.raw ios16-root.raw.part
          ls -l ios16-root.raw.part*
          shasum -a 256 ios16-root.raw ios16-root.raw.part* | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: b-track-root
          path: |
            ios16-root.img.part*
            SHA256SUMS
          if-no-files-found: error
