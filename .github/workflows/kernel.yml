# Kernel leg of the nuwa port. This is the one step that cannot run on Linux:
# `unixnu build kernel` calls xcodebuild with the iPhoneOS SDK, and `prelink` decodes the
# IPSW kernelcache with /usr/bin/compression_tool. Both exist on a macOS runner.
#
# Two passes:
#   1. bootstrap (nuwa-bootstrap_defconfig, CRYPTO_BOOTSTRAP=prelinked, no archives) builds a
#      bare kernel and prelinks it, producing the original-class candidate that
#      build-ufs-original-bindings.py reads. It also leaves the compile records behind.
#   2. full (nuwa_defconfig, CONFIG_XNU_BUILD_ARCHIVES=y) runs the board archive list — corecrypto,
#      the arm drivers, the public storage headers, the NativeUfs bring-up transport and its
#      original bindings, mockfs, PMGR, pthread, legacy display — then links and prelinks the real kernel.
#
# The hardware-qualification gates (storage ABI snapshot, verified-root policy bundle,
# VirtIO/RamBlock, owner-root, boot progress, Adreno) are off; they need device-run or
# target-volume DMG inputs. See configs/nuwa_defconfig.
#
# Produces out/nuwa/kernel/kernel.macho (the prelinked kernel) and its report.
# The optional `assemble` job then pulls the latest firmware volume from stage1-firmware.yml
# and builds the payload + boot image on Linux, so the chain closes without a Mac at home.

name: kernel

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: 'UniXNU branch/tag/commit'
        type: string
        default: main
      assemble:
        description: 'Also build the payload and boot image (needs one successful stage1 run)'
        type: boolean
        default: false
      unique_chip_id:
        description: '8-byte platform seed for the ADT (bring-up test value; use the device seed before touching userdata)'
        type: string
        default: '0102030405060708'
      jobs:
        description: 'Parallel jobs for the XNU build'
        type: string
        default: '3'

permissions:
  contents: read
  actions: read          # the assemble job reads artifacts from an earlier stage1 run

# macOS arm64 runners queue for minutes; a dispatch retried after a network error would
# otherwise sit behind an identical build, so let a newer run supersede the older one.
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  UNIXNU_OUT: ${{ github.workspace }}/UniXNU/out
  UNIXNU_UEFI: ${{ github.workspace }}/Mu-Silicium
  UNIXNU_DTB: ${{ github.workspace }}/Mu-Silicium/Platforms/Xiaomi/nuwaPkg/FdtBlob/sm8550-xiaomi-nuwa.dtb

jobs:
  kernel:
    name: XNU kernel + prelink (macos-15)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive

      - name: Checkout UniXNU build driver
        uses: actions/checkout@v4
        with:
          repository: pubglite55/UniXNU
          ref: ${{ inputs.unixnu_ref || 'main' }}
          path: UniXNU
          submodules: recursive

      - name: Install Homebrew tools the kernel step expects
        # kernel.py looks for cmake/ninja/unifdef and prefers /opt/homebrew/opt/llvm/bin.
        run: brew install cmake ninja unifdef llvm dtc mtools

      - name: Check the runner disk budget
        run: |
          df -h /
          echo "::notice::XNU needs several GB; if the build dies with 'No space left', drop the cache steps."

      - name: Cache fetched sources and the object tree
        # The two XNU passes share the Apple references, the assembled tree and the IPSW
        # kernelcache; a warm cache roughly halves the wall clock.
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/feeds
            UniXNU/out/ipsw
            UniXNU/out/nuwa/tree/build/xnu
            UniXNU/out/nuwa/tree/.cache
          key: nuwa-kernel-${{ inputs.unixnu_ref || 'main' }}-${{ hashFiles('device/configs/nuwa_defconfig', 'device/configs/nuwa-bootstrap_defconfig', 'device/board.toml', 'device/feeds.toml') }}-${{ github.run_id }}
          restore-keys: |
            nuwa-kernel-${{ inputs.unixnu_ref || 'main' }}-
            nuwa-kernel-

      - name: Bootstrap pass (assemble + fetch; expected to stop at the rate limit)
        # prepare-xnu-source.py asks api.github.com with no token and dies with HTTP 403 on the
        # shared runner IPs. The script skips the request when its cache file exists, so this first
        # pass exists to assemble the tree and fetch the references; it is expected to stop at the
        # rate limit, then the next step pre-fills the cache with the job token.
        working-directory: UniXNU
        env:
          JOBS: ${{ inputs.jobs || '3' }}
        run: |
          python3 ./unixnu defconfig nuwa-bootstrap_defconfig -D "$GITHUB_WORKSPACE/device"
          python3 ./unixnu build kernel -D "$GITHUB_WORKSPACE/device" -j "$JOBS" || true
          tree="$UNIXNU_OUT/nuwa/tree"
          test -d "$tree" || { echo "::error::the bootstrap pass did not assemble $tree"; exit 1; }
          echo "tree assembled: $tree"

      - name: Pre-fill the DriverKit/TrustCache source caches
        # prepare-xnu-source.py reads exactly these three files and skips the API when they exist.
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tree="$UNIXNU_OUT/nuwa/tree"
          tags=$(python3 -c "import tomllib,pathlib;s=tomllib.loads(pathlib.Path('feeds.toml').read_text())['source'];x=next(i for i in s if i['name']=='xnu');print(x['driverkit_tag'], x['trustcache_tag'])")
          set -- $tags
          driverkit_tag=$1
          trustcache_tag=$2
          echo "driverkit tag: $driverkit_tag   trustcache tag: $trustcache_tag"
          mkdir -p "$tree/.cache/sources"
          python3 - "$driverkit_tag" "$trustcache_tag" "$tree/.cache/sources" <<'PY'
          import json, os, sys, urllib.request

          driverkit_tag, trustcache_tag, dest = sys.argv[1], sys.argv[2], sys.argv[3]
          base = 'https://api.github.com/repos/apple-oss-distributions/xnu/contents'

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'nuwa-ci'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          plan = [
              (f'{base}/iokit/DriverKit?ref={driverkit_tag}',
               f'xnu-driverkit-{driverkit_tag.removeprefix("xnu-")}.json'),
              (f'{base}/iokit/DriverKit/crypto?ref={driverkit_tag}',
               f'xnu-driverkit-crypto-{driverkit_tag.removeprefix("xnu-")}.json'),
              (f'{base}/EXTERNAL_HEADERS/TrustCache?ref={trustcache_tag}',
               f'xnu-trustcache-{trustcache_tag.removeprefix("xnu-")}.json'),
          ]
          for url, name in plan:
              entries = fetch(url)
              with open(os.path.join(dest, name), 'w') as handle:
                  json.dump(entries, handle)
              print(f'cached {len(entries):>3} entries -> {name}')
          PY

      - name: Bootstrap kernel and prelinked candidate
        working-directory: UniXNU
        env:
          JOBS: ${{ inputs.jobs || '3' }}
        run: |
          python3 ./unixnu build kernel -D "$GITHUB_WORKSPACE/device" -j "$JOBS"
          test -f "$UNIXNU_OUT/nuwa/kernel/kernel.macho" || { echo "::error::bootstrap prelink did not produce kernel.macho"; exit 1; }
          test -f "$UNIXNU_OUT/nuwa/kernel/kernel.json" || { echo "::error::bootstrap prelink did not produce kernel.json"; exit 1; }
          # The archive binders read the prelinked original-class candidate, not the final kernel.
          mkdir -p "$UNIXNU_OUT/nuwa/tree/build/native-prelink"
          cp "$UNIXNU_OUT/nuwa/kernel/kernel.macho" \
             "$UNIXNU_OUT/nuwa/tree/build/native-prelink/native-owner-mobile-graphics-candidate.macho"
          cp "$UNIXNU_OUT/nuwa/kernel/kernel.json" \
             "$UNIXNU_OUT/nuwa/tree/build/native-prelink/native-owner-mobile-graphics-candidate.json"
          cp "$UNIXNU_OUT/nuwa/kernel/kernel.macho" \
             "$UNIXNU_OUT/nuwa/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.macho"
          cp "$UNIXNU_OUT/nuwa/kernel/kernel.json" \
             "$UNIXNU_OUT/nuwa/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.json"
          # Keep the bootstrap kernel from being uploaded as the shipping kernel.
          rm -f "$UNIXNU_OUT/nuwa/kernel/kernel.macho" "$UNIXNU_OUT/nuwa/kernel/kernel.json"
          ls -l "$UNIXNU_OUT/nuwa/tree/build/native-prelink/"

      - name: Seed the display ABI observation cache
        # build-native-legacy-display.py accepts the recorded runtime observation hash of the
        # unchanged iPad7,1 original class when the GDB dump was pruned; nuwa pins the same
        # kernelcache as sheng/uke.
        working-directory: UniXNU
        run: |
          mkdir -p "$UNIXNU_OUT/nuwa/tree/build/display-analysis"
          python3 - "$UNIXNU_OUT/nuwa/tree/build/display-analysis/mobile-graphics-legacy-abi.json" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          if not p.exists():
              p.write_text(json.dumps({'runtime_metadata_checkpoint_sha256': '3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b'}) + '\n')
          PY

      - name: Stage the kernelcache for the archive audits
        # build-sheng-platform-power.py -> audit-amfi-pmgr-contract.py reads the decompressed
        # kernelcache from .cache/firmware/kernelcache.macho/; the bootstrap prelink already left
        # out/ipsw/<build>/kernelcache.decompressed, so hand it over under the name the audit wants.
        working-directory: UniXNU
        run: |
          workspace="$UNIXNU_OUT/nuwa/tree"
          source=$(find "$UNIXNU_OUT/ipsw" -name 'kernelcache.decompressed' -print -quit)
          test -n "$source" || { echo "::error::kernelcache.decompressed not found under $UNIXNU_OUT/ipsw"; exit 1; }
          echo "kernelcache: $source"
          mkdir -p "$workspace/.cache/firmware/kernelcache.macho"
          cp "$source" "$workspace/.cache/firmware/kernelcache.macho/kernelcache.release.ipad7.decompressed"

      - name: Build and prelink the full kernel
        working-directory: UniXNU
        env:
          JOBS: ${{ inputs.jobs || '3' }}
        run: |
          python3 ./unixnu defconfig nuwa_defconfig -D "$GITHUB_WORKSPACE/device"
          python3 ./unixnu build kernel -D "$GITHUB_WORKSPACE/device" -j "$JOBS"

      - name: Report the build state
        if: always()
        working-directory: UniXNU
        run: python3 ./unixnu status || true

      - name: Build the ramdisk root (Case-sensitive HFS+)
        # The root of this bring-up is a RAM disk, not the UFS volume. IOFindBSDRoot's rd=md0
        # branch reads /chosen/memory-map RAMDisk, calls mdevadd() and never touches IOKit
        # matching; bsd_rooted_ramdisk() also skips the AMFI root seal check. The volume only
        # has to be mountable — the first question is "does BSD init get a root at all", and a
        # missing /sbin/launchd answers it with a different panic than "Failed to mount root device".
        #
        # 64 MiB keeps the payload under its 188 MiB budget (kernel ~54 MB) and matches the
        # CASE_SENSITIVE system volume the target kernel expects. hdiutil cannot write into a
        # plain file (newfs_hfs insists on a device node), so build a DMG, fill it, detach, and
        # keep the UDRW bytes: the filesystem sits at offset 0 where mdevadd() points.
        #
        # -layout NONE is mandatory: without it hdiutil puts a GPT in front of the volume
        # ("EFI PART" at offset 512). IOFindBSDRoot only accepts "mdN" as a whole device, and a
        # memory disk has no partition scanning, so md0 would be read as a disk whose volume
        # header is not at 1024 and the HFS+ mount would fail. The assertion below refuses to
        # ship such an image.
        if: ${{ inputs.assemble }}
        run: |
          set -euo pipefail
          SIZE_MIB=64
          IMG="$GITHUB_WORKSPACE/root.img"
          DMG="$GITHUB_WORKSPACE/root.dmg"
          rm -f "$IMG" "$DMG"
          mkdir -p mnt
          hdiutil create -size "${SIZE_MIB}m" -layout NONE -fs "Case-sensitive HFS+" \
                         -volname System -ov "$DMG"
          hdiutil attach -nobrowse -mountpoint mnt "$DMG"
          mkdir -p mnt/System/Library/CoreServices mnt/System/Library/Extensions \
                   mnt/private/var/db mnt/private/etc mnt/usr/lib mnt/usr/bin \
                   mnt/bin mnt/sbin mnt/Developer
          cat > mnt/System/Library/CoreServices/SystemVersion.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ProductBuildVersion</key><string>20H392</string>
            <key>ProductName</key><string>iPhone OS</string>
            <key>ProductVersion</key><string>16.7.16</string>
          </dict>
          </plist>
          PLIST
          echo "unixnu nuwa bring-up root (ramdisk)" > mnt/etc-unixnu-root.txt
          sync
          df -h mnt
          hdiutil detach mnt
          mv "$DMG" "$IMG"
          ls -l "$IMG"
          # A bare HFS+ volume carries its signature at 1024: 'HX' (case-sensitive, 0x4858) or
          # 'H+' (0x482b). Anything else means a partition map crept in and md0 cannot mount.
          sig=$(dd if="$IMG" bs=1 skip=1024 count=2 2>/dev/null | od -An -t x1 | tr -d ' \n')
          echo "volume signature at 1024: $sig"
          case "$sig" in
            4858|482b) ;;
            *) echo "::error::root.img is not a bare HFSX/HFS+ volume (signature $sig)"; exit 1 ;;
          esac
          dd if="$IMG" bs=1 skip=1024 count=8 2>/dev/null | od -A d -t x1

      - name: Upload the ramdisk root
        if: ${{ inputs.assemble }}
        uses: actions/upload-artifact@v4
        with:
          name: nuwa-root-ramdisk
          path: root.img
          compression-level: 0
          if-no-files-found: error

      - name: Upload the prelinked kernel and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuwa-kernel-${{ github.run_number }}
          path: |
            UniXNU/out/nuwa/kernel/**
            UniXNU/out/nuwa/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "### kernel step failed"
            echo ""
            echo "Log order that usually finds it:"
            echo "1. \`kernel-bootstrap.log\` — the bootstrap pass (bare kernel + prelink candidate)"
            echo "2. \`archive-NN-*.log\` — board.toml [kernel] archives, in order"
            echo "3. \`kernel.log\` — the real link"
            echo "4. \`prelink.log\` — kernelcache download, sha256 check, emit_prelink"
          } >> "$GITHUB_STEP_SUMMARY"

  assemble:
    name: payload + boot image (ubuntu)
    needs: kernel
    if: ${{ inputs.assemble && needs.kernel.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive

      - name: Checkout UniXNU build driver
        uses: actions/checkout@v4
        with:
          repository: pubglite55/UniXNU
          ref: ${{ inputs.unixnu_ref || 'main' }}
          path: UniXNU
          submodules: recursive

      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          repository: pubglite55/uefi-nuwa
          path: Mu-Silicium
          fetch-depth: 1
          submodules: false

      - name: Install payload/bootimg dependencies
        timeout-minutes: 20
        run: |
          # The runner's default mirror occasionally stalls for tens of minutes.
          # Bound every fetch so a bad mirror fails fast instead of hanging the job.
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                       -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                       -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential clang lld llvm device-tree-compiler mtools python3 git

      - name: Find the most recent successful stage1 run
        id: stage1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow stage1-firmware.yml \
                     --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::no successful stage1-firmware run yet; run that workflow first (or pass the .fd another way)"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "using stage1 run $run_id"

      - name: Download the firmware volume from that run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.stage1.outputs.run_id }}
          pattern: nuwa-stage1-*
          path: stage1-artifacts

      - name: Download this run's kernel
        uses: actions/download-artifact@v4
        with:
          name: nuwa-kernel-${{ github.run_number }}
          path: kernel-artifact

      - name: Download this run's ramdisk root
        uses: actions/download-artifact@v4
        with:
          name: nuwa-root-ramdisk
          path: root-artifact

      - name: Build the payload and pack the boot image
        working-directory: UniXNU
        run: |
          fd=$(find "$GITHUB_WORKSPACE/stage1-artifacts" -name SILICIUM_UEFI.fd | head -n1)
          kernel=$(find "$GITHUB_WORKSPACE/kernel-artifact" -name 'kernel.macho' | head -n1)
          test -n "$fd" || { echo "::error::SILICIUM_UEFI.fd not found in the stage1 artifact"; exit 1; }
          test -n "$kernel" || { echo "::error::kernel.macho not found in the kernel artifact"; exit 1; }
          echo "firmware: $fd"
          echo "kernel  : $kernel"
          # board.toml [payload] root_ramdisk decides where the root comes from. Only the
          # ramdisk root needs the image in the payload: rd=md0 reads it from initrd, while a
          # UFS root is found by rootdev= and must not carry 64 MiB of unused volume.
          ramdisk=$(python3 -c "import tomllib; print('yes' if tomllib.load(open('$GITHUB_WORKSPACE/device/board.toml', 'rb'))['payload'].get('root_ramdisk') else 'no')")
          echo "ramdisk root: $ramdisk"
          extra=()
          if [ "$ramdisk" = yes ]; then
            root=$(find "$GITHUB_WORKSPACE/root-artifact" -name 'root.img' | head -n1)
            test -n "$root" || { echo "::error::root.img not found in the nuwa-root-ramdisk artifact"; exit 1; }
            echo "root    : $root ($(stat -c%s "$root") bytes)"
            extra+=(--data-ramdisk "$root")
          fi
          python3 ./unixnu defconfig nuwa_defconfig -D "$GITHUB_WORKSPACE/device"
          python3 ./unixnu build payload -D "$GITHUB_WORKSPACE/device" --kernel "$kernel" \
            --unique-chip-id "${{ inputs.unique_chip_id }}" "${extra[@]}"
          python3 ./unixnu bootimg -D "$GITHUB_WORKSPACE/device" \
            --uefi "$UNIXNU_UEFI" --fd "$fd" --dtb "$UNIXNU_DTB" \
            --ramdisk "$UNIXNU_OUT/nuwa/payload/payload.img" || true
          # The driver's verify() parses a v3 header with the v0 layout, so it rejects the
          # correct image; the image is already written before that check, so validate it here.
          python3 "$GITHUB_WORKSPACE/device/scripts/check-bootimg.py" "$UNIXNU_OUT/nuwa/boot/boot.img"
          # The payload volume must actually be in the ramdisk, or BDS finds no OS.
          test -s "$UNIXNU_OUT/nuwa/payload/payload.img" || { echo "::error::payload.img missing"; exit 1; }

      - name: Upload the boot image with payload
        uses: actions/upload-artifact@v4
        with:
          name: nuwa-boot-payload-${{ github.run_number }}
          path: |
            UniXNU/out/nuwa/boot/**
            UniXNU/out/nuwa/payload/**
            UniXNU/out/nuwa/logs/**
          if-no-files-found: warn
          retention-days: 14
